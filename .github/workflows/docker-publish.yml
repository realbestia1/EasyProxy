name: Build Docker and Release Windows Binary

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to use APP_VERSION from config.py)'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - config.py
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: realbestia1/easyproxy

jobs:
  check-version:
    name: Check APP_VERSION bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare APP_VERSION with previous commit
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.before }}"
          OLD=""
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            OLD=$(git show "$BASE:config.py" 2>/dev/null | grep -m1 '^APP_VERSION' || true)
          fi
          NEW=$(grep -m1 '^APP_VERSION' config.py || true)
          echo "old: ${OLD:-<none>}"
          echo "new: ${NEW:-<none>}"
          if [ -n "$NEW" ] && [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push-docker:
    name: Build & Push Docker Image
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Docker Tags
        id: meta
        shell: bash
        run: |
          CONFIG_VER=$(python scripts/get_version.py)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v${CONFIG_VER}"
          fi
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  build-windows:
    name: Build Windows Standalone Executable
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller aiofiles aiosqlite selectolax

      - name: Build Windows Standalone Package
        shell: cmd
        run: |
          python scripts/build_windows_dist.py

      - name: Upload Windows Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyProxy-windows-amd64
          path: release_assets/EasyProxy-windows-amd64.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-and-push-docker, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Distribution Artifact
        uses: actions/download-artifact@v4
        with:
          name: EasyProxy-windows-amd64
          path: release_assets

      - name: Determine Release Tag
        id: tag
        shell: bash
        run: |
          CONFIG_VER=$(python scripts/get_version.py)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v${CONFIG_VER}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: EasyProxy ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release_assets/EasyProxy-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
